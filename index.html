<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HANA SUSHI</title>
  
  <style>
    h1 {
      display: none;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f5f1;
      color: #3a3a3a;
    }
    header {
      background-color: #fff5f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }
    header .logo img {
      height: 88px;
      transition: transform 0.3s ease-in-out;
    }
    header .logo img:hover {
      transform: scale(1.05);
    }
    .phone-number {
      font-size: 1.2em;
      font-weight: bold;
      color: #d45d4a;
      background: linear-gradient(to right, #ffe0e0, #ffffff);
      padding: 6px 12px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(212, 93, 74, 0.2);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .phone-number:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 10px rgba(212, 93, 74, 0.3);
    }
    nav {
      margin-top: 15px;
      display: flex;
      gap: 20px;
      justify-content: center;
      animation: fadeSlideIn 1s ease forwards;
      width: 100%;
    }
    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #d45d4a;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      animation: navLinkFade 0.6s ease forwards;
      position: relative;
      font-size: 1.1em;
    }
    nav a:nth-child(1) { animation-delay: 0.2s; }
    nav a:nth-child(2) { animation-delay: 0.4s; }
    nav a:nth-child(3) { animation-delay: 0.6s; }
    nav a::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 0;
      height: 2px;
      width: 0;
      background-color: #d45d4a;
      transition: width 0.3s;
    }
    nav a:hover {
      color: #a63f34;
    }
    nav a:hover::after {
      width: 100%;
    }
    @keyframes navLinkFade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .banner {
      background: url('banner.jpg') center/cover no-repeat;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
    }
    .menu-section {
      padding: 40px 20px;
      max-width: 100%;
      margin: auto;
    }
    .menu-section h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #d45d4a;
    }
    .menu-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding-bottom: 10px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: calc(25% - 20px);
      background: #fff;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    .menu-text {
      flex: 1;
      padding-right: 10px;
    }
    .menu-text h3 {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
      font-size: 16px;
      white-space: nowrap;
    }
    .menu-image img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
    }
    @media (max-width: 1023px) {
      .menu-item {
        width: calc(50% - 20px);
      }
    }
    @media (max-width: 767px) {
      header {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .logo img {
        height: 60px;
        margin-bottom: 10px;
      }
      .phone-number {
        font-size: 16px;
        margin-top: 10px;
      }
      nav {
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
      }
      nav a {
        margin-left: 0;
      }
      .menu-item {
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
      }
      .menu-text h3 {
        font-size: 14px;
      }
      .banner {
        height: 200px;
        font-size: 24px;
        padding: 20px;
        text-align: center;
      }
      .slider {
        width: 90%;
        height: auto;
      }
      .slides img {
        height: auto;
        width: 100%;
      }
    }
    footer {
      background-color: #fff5f0;
      text-align: center;
      padding: 20px;
      color: #7a7a7a;
      font-size: 14px;
      margin-top: 40px;
    }
    /* 슬라이더 스타일 */
    .slider {
      width: 100%;
      max-width: 500px;
      height: 300px;
      overflow: hidden;
      position: relative;
      margin: 50px auto;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
    .slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
      width: 100%;
    }
    .slides img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      flex-shrink: 0;
      border-radius: 10px;
    }
    .buttons {
      position: absolute;
      width: 100%;
      top: 50%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
      z-index: 10;
    }
    .buttons button {
      background-color: rgba(255, 255, 255, 0.7);
      border: none;
      padding: 10px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,0.15);
    }
    .buttons button:hover {
      background-color: rgba(255, 255, 255, 1);
    }

    /* 추가된 3D 슬라이더 효과 */
    .hana-slider-3d {
      perspective: 1000px;
      transform-style: preserve-3d;
    }
    .hana-slider-3d .slides {
      display: flex;
      transition: transform 0.6s ease-in-out;
      height: 300px;
    }
    .hana-slider-3d .slides img {
      height: 100%;
      width: auto;
      object-fit: cover;
      margin: 0 10px;
      border-radius: 10px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .hana-slider-3d .slides img:hover {
      transform: rotateY(5deg) scale(1.05);
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="hanasushilogoPNG.png" alt="HANA SUSHI restaurant logo" />
    </div>
    <div class="phone-number"> 📞 (805) 520-1333 / (805) 520-1313</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="banner" id="home">
    Welcome to HANA SUSHI 
  </section>

  <!-- 슬라이더 섹션 -->
  <div class="slider">
    <div class="slides" id="slideContainer">
      <img src="PAUL ROLL W 팻말 JPG.jpg" alt="Slide 1" />
      <img src="pspng.png" alt="Slide 3" />
      <img src="green heart png 1.png" alt="Slide 4" />
      <img src="fire roll.JPG" alt="Slide 5" />
      <img src="hana sushi png.png" alt="Slide 6" />
      <img src="yt sashimi png.png" alt="Slide 7" />
    </div>
    <div class="buttons">
      <button onclick="prevSlide()">⟨</button>
      <button onclick="nextSlide()">⟩</button>
    </div>
  </div>

  <!-- 홈버튼 이미지 링크 -->
  <div class="click-here-wrapper" style="text-align:center; margin-top: 30px;">
    <a href="index2.html">
      <img src="https://111368-commits.github.io/hanasushi/BACKTO%20HOME%20BUTTON%20copy1.png" alt="Click Here" style="max-width:150px; cursor:pointer;" />
    </a>
  </div>

  <footer>
    &copy; 2025 HANA SUSHI. All rights reserved.
  </footer>

  <script>
    const slideContainer = document.getElementById('slideContainer');
    const slides = slideContainer.children;
    let index = 0;

    function showSlide(i) {
      if (i < 0) {
        index = slides.length - 1;
      } else if (i >= slides.length) {
        index = 0;
      } else {
        index = i;
      }
      slideContainer.style.transform = `translateX(${-index * 100}%)`;
    }

    function nextSlide() {
      showSlide(index + 1);
    }

    function prevSlide() {
      showSlide(index - 1);
    }

    // 자동 슬라이드 (원하면 활성화)
    // setInterval(nextSlide, 4000);
  </script>

</body>
</html>
